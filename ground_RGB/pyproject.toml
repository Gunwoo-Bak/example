[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crackseg"
version = "0.1.0"
description = "RGB image crack/damage semantic segmentation inference and visualization"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision",
  "segmentation-models-pytorch",
  "opencv-python",
  "numpy",
  "PyYAML",
  "Pillow",
  "tqdm",
  "scikit-image",
  "scipy",
  "pyproj",
  "trimesh",
  "rtree",
  "warp-lang",
]

[tool.setuptools.packages.find]
where = ["src"]
